name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-east1
  SERVICE_NAME: elegan-backend
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/elegan-backend:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID" || { echo "::error::Falta el secreto GCP_PROJECT_ID"; exit 1; }
          gcloud config set project "$PROJECT_ID"

      - name: Build and publish container image
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile || { echo "::error::No existe Dockerfile en la raíz"; exit 1; }
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Verify backend imports before deployment
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n "backend\\.servicios" backend --include="*.py"; then
            echo "::error::Quedan imports antiguos backend.servicios. Deben apuntar a backend.logica."
            exit 1
          fi
          docker run --rm \
            -e MONGODB_URI="mongodb://127.0.0.1:27017" \
            -e MONGODB_DATABASE="elegan_db" \
            -e GCS_BUCKET_NAME="elegan-bucket" \
            "$IMAGE" \
            python -c "import backend.main; print('Importaciones del backend correctas')"

      - name: Deploy image to Cloud Run (retry temporary 503)
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "Intento de despliegue $attempt de 5"
            output_file="$(mktemp)"
            if gcloud run deploy "$SERVICE_NAME" \
              --image "$IMAGE" \
              --region "$REGION" \
              --service-account "elegan-cuenta-servicio@carlos-garcia-509521.iam.gserviceaccount.com" \
              --platform managed \
              --allow-unauthenticated \
              --project "$PROJECT_ID" \
              --quiet >"$output_file" 2>&1; then
              cat "$output_file"
              rm -f "$output_file"
              exit 0
            else
              status=$?
            fi
            cat "$output_file"
            if grep -Eqi '503|UNAVAILABLE|service is currently unavailable' "$output_file" && [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 20))
              echo "Cloud Run devolvió un error temporal 503. Reintentando en ${delay}s..."
              rm -f "$output_file"
              sleep "$delay"
              continue
            fi
            rm -f "$output_file"
            exit "$status"
          done
          echo "::error::Cloud Run siguió devolviendo 503 después de 5 intentos."
          exit 1

      - name: Verify Cloud Run startup, MongoDB and private bucket configuration
        shell: bash
        run: |
          set -euo pipefail
          service_file="$(mktemp)"
          health_file="$(mktemp)"
          trap 'rm -f "$service_file" "$health_file"' EXIT

          gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format=json > "$service_file"

          python - "$service_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              service = json.load(source)

          containers = service.get("spec", {}).get("template", {}).get("spec", {}).get("containers", [])
          env_names = {
              entry.get("name")
              for container in containers
              for entry in container.get("env", [])
          }
          if "GCS_PRIVATE_BUCKET_NAME" not in env_names:
              raise SystemExit("::error::Cloud Run no tiene la variable GCS_PRIVATE_BUCKET_NAME configurada.")
          print("Configuración GCS_PRIVATE_BUCKET_NAME presente en Cloud Run; su valor no se modifica ni se muestra.")
          PY

          SERVICE_URL="$(python - "$service_file" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as source:
              print(json.load(source).get("status", {}).get("url", ""))
          PY
          )"
          test -n "$SERVICE_URL" || { echo "::error::Cloud Run no devolvió la URL del servicio."; exit 1; }

          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-connrefused \
            "$SERVICE_URL/health" > "$health_file"

          python - "$health_file" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as source:
              health = json.load(source)
          if health.get("status") != "ok":
              raise SystemExit("::error::La comprobación /health no devolvió status=ok.")
          print("Cloud Run responde /health correctamente. El arranque de FastAPI y su ciclo de inicio de MongoDB finalizaron.")
          PY
