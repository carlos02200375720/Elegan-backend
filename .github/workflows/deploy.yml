name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-east1
  SERVICE_NAME: elegan-backend
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/elegan-backend:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID" || { echo "::error::Falta el secreto GCP_PROJECT_ID"; exit 1; }
          gcloud config set project "$PROJECT_ID"

      - name: Build and publish container image
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile || { echo "::error::No existe Dockerfile en la raíz"; exit 1; }
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy image to Cloud Run (retry temporary 503)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Intento de despliegue $attempt de 5"
            output_file="$(mktemp)"
            if gcloud run deploy "$SERVICE_NAME" \
              --image "$IMAGE" \
              --region "$REGION" \
              --platform managed \
              --allow-unauthenticated \
              --project "$PROJECT_ID" \
              --quiet >"$output_file" 2>&1; then
              cat "$output_file"
              rm -f "$output_file"
              exit 0
            else
              status=$?
            fi
            cat "$output_file"
            if grep -Eqi '503|UNAVAILABLE|service is currently unavailable' "$output_file" && [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 20))
              echo "Cloud Run devolvió un error temporal 503. Reintentando en ${delay}s..."
              rm -f "$output_file"
              sleep "$delay"
              continue
            fi
            rm -f "$output_file"
            exit "$status"
          done
          echo "::error::Cloud Run siguió devolviendo 503 después de 5 intentos."
          exit 1
